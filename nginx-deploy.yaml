apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx
spec:
  replicas: 5
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      imagePullSecrets:
      - name: ecr-secret
      containers:
      - name: eks-nginx
        image: 933090817123.dkr.ecr.us-west-1.amazonaws.com/lgcns-6:v2.0
        ports:
        - containerPort: 80
